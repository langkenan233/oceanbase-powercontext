# Lint configuration for the SDD context module.
#
# The rules match the ones the PowerContext project uses. Two additions: the
# test directories of the module and of the business project are allowed to
# use assert and to call subprocess, and two directories are excluded. The
# snapshot directory holds the code as it was before the change, the vendor
# directory holds an unmodified copy of the upstream PowerContext source.

[tool.ruff]
target-version = "py311"
line-length = 120
fix = true
extend-exclude = ["workload/snapshots", "vendor"]

[tool.ruff.lint]
select = [
    "ASYNC",
    "YTT",
    "S",
    "B",
    "A",
    "C4",
    "T10",
    "DTZ",
    "LOG",
    "SIM",
    "I",
    "C90",
    "E", "W",
    "F",
    "PLE",
    "PGH",
    "UP",
    "RUF",
    "TRY",
]
ignore = [
    "E501",
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S603"]
"workload/app/tests/*.py" = ["S101", "S603"]
"scripts/*.py" = ["S603", "S607"]

[tool.ruff.format]
preview = true
